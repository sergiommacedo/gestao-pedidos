<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modalDetalhesPedido"
     class="modal fade" id="modalDetalhesPedido" tabindex="-1"
     aria-labelledby="tituloModalDetalhesPedido" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content" data-conteudo-detalhes-pedido>
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="tituloModalDetalhesPedido">
                    <i class="bi bi-receipt me-1"></i> Detalhes do pedido
                </h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
            </div>
            <div class="modal-body py-5 text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="text-muted mb-0 mt-3">Carregando pedido...</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
