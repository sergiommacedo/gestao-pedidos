<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="modalRedefinirSenhaUsuario" class="modal fade"
     id="modalRedefinirSenhaUsuario" tabindex="-1"
     aria-labelledby="tituloModalRedefinirSenhaUsuario" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="post" data-form-redefinir-senha-usuario>
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModalRedefinirSenhaUsuario">
                        <i class="bi bi-key-fill text-warning me-2"></i>
                        Redefinir senha
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                            aria-label="Fechar"></button>
                </div>

                <div class="modal-body">
                    <p class="text-body-secondary" data-usuario-redefinicao>
                        Informe uma nova senha para o usuário.
                    </p>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="mb-3">
                        <label for="novaSenhaUsuario" class="form-label">Nova senha *</label>
                        <input type="password" id="novaSenhaUsuario" name="novaSenha"
                               class="form-control" minlength="6" autocomplete="new-password"
                               required data-nova-senha-usuario>
                        <div class="invalid-feedback">Informe uma senha com pelo menos 6 caracteres.</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmarSenhaUsuario" class="form-label">Confirmar senha *</label>
                        <input type="password" id="confirmarSenhaUsuario" name="confirmarSenha"
                               class="form-control" minlength="6" autocomplete="new-password"
                               required data-confirmar-senha-usuario>
                        <div class="invalid-feedback">A confirmação deve coincidir com a nova senha.</div>
                    </div>

                    <div class="form-check form-switch">
                        <input type="checkbox" class="form-check-input" role="switch"
                               id="obrigarTrocaSenhaUsuario" name="obrigarTroca" value="true">
                        <label class="form-check-label" for="obrigarTrocaSenhaUsuario">
                            Obrigar troca no próximo acesso
                        </label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-key me-1"></i>
                        Redefinir senha
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</html>
