<div th:fragment="toast">

    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="toastSucesso"
             class="toast text-bg-success border-0"
             role="alert">

            <div class="d-flex">

                <div class="toast-body">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    <span th:text="${mensagemSucesso}">
                        Operação realizada com sucesso.
                    </span>

                </div>

                <button
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>

            </div>

        </div>

        <div id="toastErro"
             class="toast text-bg-danger border-0"
             role="alert"
             aria-live="assertive" aria-atomic="true"
             th:if="${mensagemErro}">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${mensagemErro}">Não foi possível realizar a operação.</span>
                </div>
                <button class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>

    </div>

    <script th:if="${mensagemSucesso}">
        document.addEventListener("DOMContentLoaded", () => {

            const toast = new bootstrap.Toast(
                document.getElementById("toastSucesso"),
                {
                    delay: 3500
                }
            );

            toast.show();

        });
    </script>

    <script th:if="${mensagemErro}">
        document.addEventListener("DOMContentLoaded", () => {
            const toast = new bootstrap.Toast(
                document.getElementById("toastErro"),
                {delay: 5000}
            );
            toast.show();
        });
    </script>

</div>
