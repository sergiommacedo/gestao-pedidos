<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg bg-white border-bottom fixed-top">

    <div class="container-fluid px-3">

        <button class="btn btn-outline-secondary d-lg-none me-2"
                type="button"
                id="sidebarToggle"
                aria-label="Abrir menu lateral">

            <i class="bi bi-list"></i>

        </button>

        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2"
           th:href="@{/dashboard}">

            <i class="bi bi-box-seam"></i>

            <span>Gestão de Pedidos</span>

        </a>

        <div class="dropdown ms-auto">

            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <i class="bi bi-person-circle fs-5"></i>

                <span class="d-none d-sm-inline"
                      sec:authentication="name">
                    Usuário
                </span>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow-sm">

                <li>

                    <span class="dropdown-item-text text-muted small"
                          sec:authentication="authorities">
                        Perfil
                    </span>

                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <form th:action="@{/logout}" method="post">

                        <button type="submit"
                                class="dropdown-item">

                            <i class="bi bi-box-arrow-right me-2"></i>
                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
