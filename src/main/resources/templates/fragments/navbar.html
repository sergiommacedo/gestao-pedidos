<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg app-navbar fixed-top shadow-sm">

    <div class="container-fluid px-3">

        <!-- Botão do menu em telas pequenas -->
        <button class="btn btn-outline-secondary d-lg-none me-2"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebar"
                aria-controls="sidebar"
                aria-label="Abrir menu lateral">

            <i class="bi bi-list fs-5"></i>

        </button>

        <!-- Marca do sistema -->
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2 mb-0"
           th:href="@{/}">

            <img th:src="${configuracaoEmpresa.logoUrl}"
                 class="app-logo"
                 th:alt="${'Logo ' + configuracaoEmpresa.nomeEmpresa}">

            <span class="d-none d-sm-inline"
                  th:text="${configuracaoEmpresa.nomeCurto}">
                Empresa
            </span>
        </a>

        <!-- Usuário autenticado -->
        <div class="dropdown ms-auto">

            <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center gap-2 user-menu-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-label="Abrir menu do usuário"
                    aria-expanded="false">

                <i class="bi bi-person-circle fs-5"></i>

                <span class="d-none d-sm-inline"
                      aria-hidden="true">
                    Conta
                </span>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow-sm user-menu">

                <li>

                    <h6 class="dropdown-header">
                        Usuário conectado
                    </h6>

                </li>

                <li>

                    <span class="dropdown-item-text user-menu-login"
                          sec:authentication="name">
                        usuario@email.com
                    </span>

                </li>

                <li>

                    <span class="dropdown-item-text user-menu-profile"
                          sec:authorize="hasRole('ADMIN')">
                        Administrador
                    </span>

                    <span class="dropdown-item-text user-menu-profile"
                          sec:authorize="hasRole('ATENDENTE') and !hasRole('ADMIN')">
                        Atendente
                    </span>

                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <a th:href="@{/configuracoes}"
                       sec:authorize="hasRole('ADMIN')"
                       class="dropdown-item">

                        <i class="bi bi-gear me-2"></i>
                        Configurações

                    </a>

                </li>

                <li sec:authorize="hasRole('ADMIN')">
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <form th:action="@{/logout}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <button type="submit"
                                class="dropdown-item text-danger">

                            <i class="bi bi-box-arrow-right me-2"></i>
                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
