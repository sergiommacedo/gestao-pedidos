<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg app-navbar fixed-top shadow-sm">

    <div class="container-fluid px-3">

        <!-- Botão do menu em telas pequenas -->
        <button class="btn btn-outline-secondary d-lg-none me-2"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#sidebar"
                aria-controls="sidebar"
                aria-label="Abrir menu lateral">

            <i class="bi bi-list fs-5"></i>

        </button>

        <!-- Marca do sistema -->
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2 mb-0"
           th:href="@{/}">

            <img th:src="${configuracaoEmpresa.logoUrl}"
                 class="app-logo"
                 th:alt="${'Logo ' + configuracaoEmpresa.nomeEmpresa}">

            <span class="d-none d-sm-inline"
                  th:text="${configuracaoEmpresa.nomeCurto}">
                Empresa
            </span>
        </a>

        <!-- Usuário autenticado -->
        <div class="dropdown ms-auto">

            <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center gap-2"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <i class="bi bi-person-circle fs-5"></i>

                <span class="d-none d-sm-inline"
                      sec:authentication="name">
                    Usuário
                </span>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow-sm">

                <li>

                    <h6 class="dropdown-header">
                        Usuário conectado
                    </h6>

                </li>

                <li>

                    <span class="dropdown-item-text text-body-secondary small"
                          sec:authentication="authorities">
                        Perfil
                    </span>

                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="dropdown-item text-danger">

                            <i class="bi bi-box-arrow-right me-2"></i>
                            Sair

                        </button>

                    </form>

                </li>

            </ul>

        </div>

    </div>

</nav>

</body>
</html>
