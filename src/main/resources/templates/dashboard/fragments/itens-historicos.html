<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="conteudo" class="border-top pt-2 mt-2">
    <div class="py-2" th:each="item : ${detalhes.itens}">
        <div class="fw-semibold text-break" th:text="${item.produtoNome}"></div>
        <div class="d-flex flex-wrap gap-3 small">
            <span th:text="${@formatacao.formatarQuantidade(item.quantidade,item.unidade)}"></span>
            <span th:if="${item.percentualDesconto.signum() > 0}" th:text="${@formatacao.formatarMoeda(item.precoUnitarioOriginal)+' → '+@formatacao.formatarMoeda(item.precoUnitario)+' ('+@formatacao.formatarDecimalBrasileiro(item.percentualDesconto,2)+'% desc.)'}"></span>
            <span th:unless="${item.percentualDesconto.signum() > 0}" th:text="${@formatacao.formatarMoeda(item.precoUnitario) + '/' + (item.unidade.name() == 'QUILOGRAMA' ? 'kg' : 'un')}"></span>
            <span>Subtotal <strong th:text="${@formatacao.formatarMoeda(item.subtotal)}"></strong></span>
        </div>
    </div>
    <div class="border-top pt-2 small">
        <div class="d-flex justify-content-between"><span>Subtotal dos produtos</span><strong th:text="${@formatacao.formatarMoeda(detalhes.subtotal)}"></strong></div>
        <div class="d-flex justify-content-between text-success" th:if="${detalhes.valorDescontoGeral.signum() > 0}"><span th:text="${'Desconto geral '+@formatacao.formatarDecimalBrasileiro(detalhes.percentualDescontoGeral,2)+'%'}"></span><strong th:text="${'-'+@formatacao.formatarMoeda(detalhes.valorDescontoGeral)}"></strong></div>
        <div class="d-flex justify-content-between"><span>Taxa de entrega</span><strong th:text="${@formatacao.formatarMoeda(detalhes.taxaEntrega)}"></strong></div>
        <div class="d-flex justify-content-between fs-6"><span>Total</span><strong th:text="${@formatacao.formatarMoeda(detalhes.valorTotal)}"></strong></div>
    </div>
</div>
</html>
