<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1">Compra de <span th:text="${#temporals.format(compra.dataCompra,'dd/MM/yyyy')}"></span></h1><p class="text-body-secondary mb-0">Registro histórico dos materiais comprados.</p></div><div class="d-flex gap-2"><a th:href="@{/compras-insumos}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a><a th:href="@{/compras-insumos/{id}/editar(id=${compra.id})}" class="btn btn-primary"><i class="bi bi-pencil me-1"></i> Editar</a></div></header>
<div class="card shadow-sm mb-4"><div class="card-body"><dl class="row mb-0"><dt class="col-sm-3">Data</dt><dd class="col-sm-9" th:text="${#temporals.format(compra.dataCompra,'dd/MM/yyyy')}"></dd><dt class="col-sm-3">Fornecedor</dt><dd class="col-sm-9" th:text="${compra.fornecedor!=null?compra.fornecedor:'Não informado'}"></dd><dt class="col-sm-3">Criado em</dt><dd class="col-sm-9" th:text="${#temporals.format(compra.criadoEm,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-sm-3">Atualizado em</dt><dd class="col-sm-9" th:text="${#temporals.format(compra.atualizadoEm,'dd/MM/yyyy HH:mm')}"></dd><dt class="col-sm-3" th:if="${compra.observacao!=null}">Observação</dt><dd class="col-sm-9" th:if="${compra.observacao!=null}" th:text="${compra.observacao}"></dd></dl></div></div>
<div class="card shadow-sm"><div class="card-header bg-white"><h2 class="h5 mb-0">Itens comprados</h2></div><div class="card-body p-0"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Insumo</th><th>Quantidade</th><th>Unidade</th><th>Valor pago</th><th>Custo unitário</th></tr></thead><tbody><tr th:each="item:${compra.itens}"><td class="fw-semibold" th:text="${item.insumoNome}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(item.quantidade,item.unidadeMedida.name()=='UNIDADE'?0:3)}"></td><td th:text="${item.unidadeMedida.descricao+' ('+item.unidadeMedida.simbolo+')'}"></td><td th:text="${@formatacao.formatarMoeda(item.valorTotalItem)}"></td><td th:text="${'R$ '+@formatacao.formatarDecimalBrasileiro(item.custoUnitario,6)+'/'+item.unidadeMedida.simbolo}"></td></tr></tbody></table></div></div><div class="card-footer bg-white d-flex justify-content-between"><span th:text="${compra.quantidadeItens+' item(ns)'}"></span><strong th:text="${'Total: '+@formatacao.formatarMoeda(compra.valorTotal)}"></strong></div></div>
</section></html>
