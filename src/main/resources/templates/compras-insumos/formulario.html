<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex justify-content-between align-items-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1" th:text="${titulo}">Nova compra</h1><p class="text-body-secondary mb-0">Registre os valores reais pagos pelos materiais.</p></div><a th:href="@{/compras-insumos}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a></header>
<form th:object="${compra}" th:action="${modoEdicao}?@{/compras-insumos/{id}(id=${compraId})}:@{/compras-insumos}" method="post" data-form-compra-insumo novalidate><div class="alert alert-info" th:if="${financeiroBloqueado}"><i class="bi bi-lock me-1"></i> Esta compra já gerou estoque. Data e itens são históricos; somente fornecedor e observação podem ser alterados.</div><div class="card shadow-sm mb-4"><div class="card-header bg-white"><h2 class="h5 mb-0">Dados da compra</h2></div><div class="card-body"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="erro:${#fields.globalErrors()}" th:text="${erro}"></div><div class="row g-3"><div class="col-md-4"><label class="form-label">Data da compra *</label><input type="date" name="dataCompra" class="form-control" th:value="${compra.dataCompra!=null?#temporals.format(compra.dataCompra,'yyyy-MM-dd'):''}" th:readonly="${financeiroBloqueado}" required><div class="text-danger small" th:errors="*{dataCompra}"></div></div><div class="col-md-8"><label class="form-label">Fornecedor</label><input type="text" class="form-control" th:field="*{fornecedor}" maxlength="150"><div class="text-danger small" th:errors="*{fornecedor}"></div></div><div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" rows="3" maxlength="500" th:field="*{observacao}"></textarea><div class="text-danger small" th:errors="*{observacao}"></div></div></div></div></div>
<div class="card shadow-sm"><div class="card-header bg-white"><h2 class="h5 mb-0">Itens</h2></div><div class="card-body"><div class="row g-2 align-items-end mb-3"><div class="col-md-9 position-relative"><label class="form-label" for="buscaInsumoCompra">Insumo</label><input id="buscaInsumoCompra" type="search" class="form-control" autocomplete="off" placeholder="Digite ao menos duas letras" data-busca-insumo-compra><div class="list-group position-absolute start-0 end-0 shadow d-none" data-resultados-insumo-compra></div></div><div class="col-md-3"><button type="button" class="btn btn-outline-primary w-100" data-adicionar-insumo-compra disabled><i class="bi bi-plus-circle me-1"></i> Adicionar insumo</button></div></div><div class="alert alert-warning d-none" data-erro-itens-compra></div><div data-itens-compra></div><div class="text-center text-body-secondary py-4" data-itens-compra-vazio>Nenhum insumo adicionado.</div>
<div th:each="item:${itensFormulario}" data-item-compra-inicial th:data-id="${item.id}" th:data-insumo-id="${item.insumoId}" th:data-nome="${item.insumoNome}" th:data-unidade="${item.unidadeMedida.name()}" th:data-simbolo="${item.unidadeMedida.simbolo}" th:data-quantidade="${item.quantidade}" th:data-valor="${item.valorTotalItem}"></div>
</div><div class="card-footer bg-white"><div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3"><div><span class="text-body-secondary">Itens:</span> <strong data-quantidade-itens-compra>0</strong><span class="ms-3 text-body-secondary">Total:</span> <strong data-total-compra>R$ 0,00</strong></div><div class="d-flex gap-2"><a th:href="@{/compras-insumos}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i><span th:text="${modoEdicao}?'Salvar alterações':'Salvar compra'"></span></button></div></div></div></div></form>
</section></html>
