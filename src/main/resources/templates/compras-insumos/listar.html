<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1"><i class="bi bi-cart-plus me-1"></i> Compras de Insumos</h1><p class="text-body-secondary mb-0">Registre as compras de materiais utilizados na produção.</p></div><a th:href="@{/compras-insumos/nova}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nova compra</a></header>
<div class="alert alert-danger" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>
<div class="card shadow-sm mb-4"><div class="card-header bg-white"><h2 class="h5 mb-0">Filtros</h2></div><div class="card-body"><form method="get" th:action="@{/compras-insumos}" class="row g-3 align-items-end"><div class="col-sm-6 col-md-3"><label class="form-label">Data inicial</label><input type="date" name="dataInicial" class="form-control" th:value="${dataInicial}"></div><div class="col-sm-6 col-md-3"><label class="form-label">Data final</label><input type="date" name="dataFinal" class="form-control" th:value="${dataFinal}"></div><div class="col-md-4"><label class="form-label">Fornecedor</label><input type="search" name="fornecedor" class="form-control" th:value="${fornecedor}"></div><input type="hidden" name="tamanho" th:value="${tamanho}"><div class="col-auto"><button class="btn btn-primary"><i class="bi bi-search me-1"></i> Filtrar</button></div></form></div></div>
<div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Valor total</th><th>Atualizado em</th><th>Ações</th></tr></thead><tbody><tr th:each="compra:${compras}"><td th:text="${compra.id}"></td><td class="text-nowrap" th:text="${#temporals.format(compra.dataCompra,'dd/MM/yyyy')}"></td><td th:text="${compra.fornecedor!=null?compra.fornecedor:'Não informado'}"></td><td th:text="${compra.quantidadeItens}"></td><td class="fw-semibold" th:text="${@formatacao.formatarMoeda(compra.valorTotal)}"></td><td class="text-nowrap" th:text="${#temporals.format(compra.atualizadoEm,'dd/MM/yyyy HH:mm')}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/compras-insumos/{id}(id=${compra.id})}" title="Visualizar"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-primary" th:href="@{/compras-insumos/{id}/editar(id=${compra.id})}" title="Editar"><i class="bi bi-pencil"></i></a> <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal" data-bs-target="#modalExclusao" th:data-exclusao-id="${compra.id}" th:data-exclusao-descricao="${'Compra de '+#temporals.format(compra.dataCompra,'dd/MM/yyyy')+' — o registro e seus itens serão removidos.'}" th:data-exclusao-url="@{/compras-insumos/{id}/excluir(id=${compra.id})}"><i class="bi bi-trash"></i></button></td></tr><tr th:if="${paginaCompras.empty}"><td colspan="7" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Nenhuma compra de insumos cadastrada.</td></tr></tbody></table></div></div>
<div class="card-footer bg-white" th:if="${paginaCompras.totalPages>0}"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"><form method="get" th:action="@{/compras-insumos}" class="d-flex align-items-center gap-2"><label class="small text-nowrap" for="tamanhoCompra">Por página:</label><select id="tamanhoCompra" name="tamanho" class="form-select form-select-sm" onchange="this.form.submit()"><option value="10" th:selected="${tamanho==10}">10</option><option value="20" th:selected="${tamanho==20}">20</option><option value="50" th:selected="${tamanho==50}">50</option></select><input type="hidden" name="dataInicial" th:value="${dataInicial}"><input type="hidden" name="dataFinal" th:value="${dataFinal}"><input type="hidden" name="fornecedor" th:value="${fornecedor}"><input type="hidden" name="ordenarPor" th:value="${ordenarPor}"><input type="hidden" name="direcao" th:value="${direcao}"></form><nav th:if="${paginaCompras.totalPages>1}"><ul class="pagination pagination-sm mb-0"><li class="page-item" th:classappend="${paginaCompras.first}?' disabled'"><a class="page-link" th:href="@{/compras-insumos(dataInicial=${dataInicial},dataFinal=${dataFinal},fornecedor=${fornecedor},pagina=${paginaCompras.number-1},tamanho=${tamanho},ordenarPor=${ordenarPor},direcao=${direcao})}">Anterior</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Página '+(paginaCompras.number+1)+' de '+paginaCompras.totalPages}"></span></li><li class="page-item" th:classappend="${paginaCompras.last}?' disabled'"><a class="page-link" th:href="@{/compras-insumos(dataInicial=${dataInicial},dataFinal=${dataFinal},fornecedor=${fornecedor},pagina=${paginaCompras.number+1},tamanho=${tamanho},ordenarPor=${ordenarPor},direcao=${direcao})}">Próxima</a></li></ul></nav></div></div></div><div th:replace="~{fragments/modal-exclusao :: modalExclusao}"></div>
</section></html>
