<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1"><i class="bi bi-cart-plus me-1"></i> Compras</h1><p class="text-body-secondary mb-0">Registre as compras de materiais e produtos de revenda.</p></div><a th:href="@{/compras/nova}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nova compra</a></header>
<div class="alert alert-danger" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>
<div class="card shadow-sm mb-4"><div class="card-header bg-white"><h2 class="h5 mb-0">Filtros</h2></div><div class="card-body"><form method="get" th:action="@{/compras}" class="row g-3 align-items-end"><div class="col-sm-6 col-lg-2"><label class="form-label">Data inicial</label><input type="date" name="dataInicial" class="form-control" th:value="${dataInicial}"></div><div class="col-sm-6 col-lg-2"><label class="form-label">Data final</label><input type="date" name="dataFinal" class="form-control" th:value="${dataFinal}"></div><div class="col-md-4 col-lg-3"><label class="form-label">Fornecedor</label><input type="search" name="fornecedor" class="form-control" th:value="${fornecedor}"></div><div class="col-md-4 col-lg-3"><label class="form-label">Tipo</label><select class="form-select" name="tipoCompra"><option value="">Todos</option><option th:each="t:${tiposCompra}" th:value="${t}" th:text="${t.descricao}" th:selected="${t==tipoCompra}"></option></select></div><input type="hidden" name="tamanho" th:value="${tamanho}"><div class="col-auto"><button class="btn btn-primary">Filtrar</button></div></form></div></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>ID</th><th>Tipo</th><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Valor total</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="compra:${compras}"><td th:text="${compra.id}"></td><td><span class="badge text-bg-light" th:text="${compra.tipoCompra.descricao}"></span></td><td th:text="${#temporals.format(compra.dataCompra,'dd/MM/yyyy')}"></td><td th:text="${compra.fornecedor?:'Não informado'}"></td><td th:text="${compra.quantidadeItens}"></td><td class="fw-semibold" th:text="${@formatacao.formatarMoeda(compra.valorTotal)}"></td><td><span class="badge" th:classappend="${compra.status.name()=='ATIVA'}?' text-bg-success':' text-bg-secondary'" th:text="${compra.status.descricao}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/compras/{id}(id=${compra.id})}" title="Visualizar"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-primary" th:href="@{/compras/{id}/editar(id=${compra.id})}" title="Editar"><i class="bi bi-pencil"></i></a></td></tr><tr th:if="${paginaCompras.empty}"><td colspan="8" class="text-center text-body-secondary py-5">Nenhuma compra cadastrada.</td></tr></tbody></table></div><div class="card-footer bg-white d-flex justify-content-between" th:if="${paginaCompras.totalPages>1}"><a class="btn btn-sm btn-outline-secondary" th:classappend="${paginaCompras.first}?' disabled'" th:href="@{/compras(dataInicial=${dataInicial},dataFinal=${dataFinal},fornecedor=${fornecedor},tipoCompra=${tipoCompra},pagina=${paginaCompras.number-1},tamanho=${tamanho})}">Anterior</a><span th:text="${'Página '+(paginaCompras.number+1)+' de '+paginaCompras.totalPages}"></span><a class="btn btn-sm btn-outline-secondary" th:classappend="${paginaCompras.last}?' disabled'" th:href="@{/compras(dataInicial=${dataInicial},dataFinal=${dataFinal},fornecedor=${fornecedor},tipoCompra=${tipoCompra},pagina=${paginaCompras.number+1},tamanho=${tamanho})}">Próxima</a></div></div>
</section></html>
