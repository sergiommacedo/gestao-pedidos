<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex justify-content-between align-items-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1" th:text="${titulo}">Nova compra</h1><p class="text-body-secondary mb-0">Registre os valores reais pagos pelos itens.</p></div><a th:href="@{/compras}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a></header>
<form th:object="${compra}" th:action="${modoEdicao}?@{/compras/{id}(id=${compraId})}:@{/compras}" method="post" data-form-compra th:data-financeiro-bloqueado="${financeiroBloqueado}" novalidate><div class="alert alert-info" th:if="${financeiroBloqueado}"><i class="bi bi-lock me-1"></i> Esta compra já gerou estoque. Tipo, data e itens são históricos; somente fornecedor e observação podem ser alterados.</div><div class="card shadow-sm mb-4"><div class="card-header bg-white"><h2 class="h5 mb-0">Dados da compra</h2></div><div class="card-body"><div class="alert alert-danger" th:each="erro:${#fields.globalErrors()}" th:text="${erro}"></div>
<fieldset class="mb-4" th:disabled="${modoEdicao}"><legend class="form-label fw-semibold">O que foi comprado? *</legend><div class="row g-3"><div class="col-md-6"><label class="border rounded p-3 d-flex gap-3 h-100"><input class="form-check-input" type="radio" th:field="*{tipoCompra}" value="INSUMO" data-tipo-compra><span><strong class="d-block">Insumos</strong><small class="text-body-secondary">Ingredientes, embalagens e materiais utilizados na produção.</small></span></label></div><div class="col-md-6"><label class="border rounded p-3 d-flex gap-3 h-100"><input class="form-check-input" type="radio" th:field="*{tipoCompra}" value="PRODUTO_REVENDA" data-tipo-compra><span><strong class="d-block">Produtos de revenda</strong><small class="text-body-secondary">Produtos comprados prontos para serem vendidos.</small></span></label></div></div><div class="text-danger small" th:errors="*{tipoCompra}"></div></fieldset><input th:if="${modoEdicao}" type="hidden" th:field="*{tipoCompra}">
<div class="row g-3"><div class="col-md-4"><label class="form-label">Data da compra *</label><input type="date" name="dataCompra" class="form-control" th:value="${compra.dataCompra!=null?#temporals.format(compra.dataCompra,'yyyy-MM-dd'):''}" th:readonly="${financeiroBloqueado}" required></div><div class="col-md-8"><label class="form-label">Fornecedor</label><input class="form-control" th:field="*{fornecedor}" maxlength="150"></div><div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" rows="3" maxlength="500" th:field="*{observacao}"></textarea></div></div></div></div>
<div class="card shadow-sm"><div class="card-header bg-white"><h2 class="h5 mb-0">Itens</h2></div><div class="card-body"><div class="row g-2 align-items-end mb-3"><div class="col-md-9 position-relative"><label class="form-label" for="buscaItemCompra">Item comprado</label><input id="buscaItemCompra" type="search" class="form-control" autocomplete="off" placeholder="Escolha o tipo e pesquise pelo nome" data-busca-item-compra><div class="list-group position-absolute start-0 end-0 shadow d-none" data-resultados-item-compra></div></div><div class="col-md-3"><button type="button" class="btn btn-outline-primary w-100" data-adicionar-item-compra disabled><i class="bi bi-plus-circle me-1"></i> Adicionar item</button></div></div><div class="alert alert-warning d-none" data-erro-itens-compra></div><div data-itens-compra></div><div class="text-center text-body-secondary py-4" data-itens-compra-vazio>Nenhum item adicionado.</div>
<div th:each="item:${itensFormulario}" data-item-compra-inicial th:data-id="${item.id}" th:data-referencia-id="${item.referenciaId}" th:data-nome="${item.nomeHistorico}" th:data-unidade="${item.unidadeHistorica.name()}" th:data-simbolo="${item.unidadeHistorica.simbolo}" th:data-quantidade="${item.quantidade}" th:data-valor="${item.valorTotalItem}"></div></div><div class="card-footer bg-white"><div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3"><div><span class="text-body-secondary">Itens:</span> <strong data-quantidade-itens-compra>0</strong><span class="ms-3 text-body-secondary">Total:</span> <strong data-total-compra>R$ 0,00</strong></div><div class="d-flex gap-2"><a th:href="@{/compras}" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary"><span th:text="${modoEdicao}?'Salvar alterações':'Salvar compra'"></span></button></div></div></div></div></form>
</section></html>
