<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="page-header"><div class="page-header-content"><h1 class="h3 fw-semibold mb-1"><i class="bi bi-box-seam me-1"></i> <span th:text="${titulo}">Novo insumo</span></h1><p class="text-body-secondary mb-0">Informe como o material utilizado na produção é medido.</p></div><div class="page-header-actions"><a th:href="@{/insumos}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a></div></header>
<div class="card shadow-sm"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">Dados do insumo</h2></div><form th:object="${insumo}" th:action="${modoEdicao}?@{/insumos/{id}(id=${insumoId})}:@{/insumos}" method="post" data-form-insumo novalidate><div class="card-body p-4">
<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="erro:${#fields.globalErrors()}" th:text="${erro}"></div>
<div class="row g-3">
<div class="col-md-7"><label class="form-label" for="nome">Nome *</label><input id="nome" type="text" class="form-control" th:classappend="${#fields.hasErrors('nome')}?' is-invalid'" th:field="*{nome}" maxlength="100" autofocus required><div class="invalid-feedback" th:errors="*{nome}"></div></div>
<div class="col-md-5"><label class="form-label" for="unidadeMedida">Unidade de medida *</label><select id="unidadeMedida" class="form-select" th:classappend="${#fields.hasErrors('unidadeMedida')}?' is-invalid'" th:field="*{unidadeMedida}" data-unidade-medida-insumo required><option value="">Selecione</option><option th:each="unidade:${unidadesMedida}" th:value="${unidade}" th:text="${unidade.descricao}" th:data-simbolo="${unidade.simbolo}"></option></select><div class="invalid-feedback" th:errors="*{unidadeMedida}"></div></div>
<div class="col-12"><label class="form-label" for="descricao">Descrição</label><textarea id="descricao" class="form-control" rows="3" maxlength="255" th:classappend="${#fields.hasErrors('descricao')}?' is-invalid'" th:field="*{descricao}"></textarea><div class="invalid-feedback" th:errors="*{descricao}"></div></div>
<div class="col-md-6"><label class="form-label" for="estoqueMinimoVisual">Estoque mínimo</label><div class="input-group"><input id="estoqueMinimoVisual" type="text" class="form-control" inputmode="decimal" data-moeda-visual data-quantidade-insumo data-casas-decimais="3" th:value="${@formatacao.formatarDecimalBrasileiro(insumo.estoqueMinimo,3)}"><span class="input-group-text" data-simbolo-insumo>—</span><input type="hidden" th:field="*{estoqueMinimo}" data-moeda-decimal></div><div class="form-text" id="ajudaEstoqueMinimo">Quantidade mínima desejada para alertas futuros de estoque.</div><div class="text-danger small" th:errors="*{estoqueMinimo}"></div></div>
<div class="col-12"><label class="form-label" for="observacao">Observação</label><textarea id="observacao" class="form-control" rows="4" maxlength="500" th:classappend="${#fields.hasErrors('observacao')}?' is-invalid'" th:field="*{observacao}"></textarea><div class="invalid-feedback" th:errors="*{observacao}"></div></div>
<div class="col-12"><div class="form-check form-switch border rounded p-3 ps-5"><input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}"><label class="form-check-label fw-semibold" for="ativo">Insumo ativo</label><div class="form-text">Insumos inativos deixam de aparecer em operações futuras, mas permanecem no histórico.</div></div></div>
</div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a th:href="@{/insumos}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i> Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i><span th:text="${modoEdicao}?'Salvar alterações':'Salvar insumo'"></span></button></div></form></div>
</section></html>
