<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1"><i class="bi bi-box-seam me-1"></i> Insumos</h1><p class="text-body-secondary mb-0">Cadastre os materiais utilizados na produção.</p></div><a th:href="@{/insumos/novo}" class="btn btn-primary flex-shrink-0"><i class="bi bi-plus-circle me-1"></i> Novo insumo</a></header>
<div class="card shadow-sm mb-4"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">Filtros</h2></div><div class="card-body"><form th:action="@{/insumos}" method="get" class="row g-3 align-items-end"><div class="col-md-6"><label class="form-label" for="filtro">Nome ou descrição</label><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="filtro" type="search" name="filtro" class="form-control" placeholder="Pesquisar insumo" th:value="${filtro}"></div></div><div class="col-sm-6 col-md-3"><label class="form-label" for="ativoFiltro">Status</label><select id="ativoFiltro" name="ativo" class="form-select"><option value="" th:selected="${ativo==null}">Todos</option><option value="true" th:selected="${ativo==true}">Ativos</option><option value="false" th:selected="${ativo==false}">Inativos</option></select></div><input type="hidden" name="tamanho" th:value="${tamanho}"><input type="hidden" name="ordenarPor" th:value="${ordenarPor}"><input type="hidden" name="direcao" th:value="${direcao}"><div class="col-auto"><button class="btn btn-primary"><i class="bi bi-search me-1"></i> Pesquisar</button></div><div class="col-auto" th:if="${temFiltros}"><a th:href="@{/insumos}" class="btn btn-outline-secondary">Limpar</a></div></form></div></div>
<div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr>
<th><a class="text-decoration-none text-body" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=0,tamanho=${tamanho},ordenarPor='id',direcao=${ordenarPor=='id' and direcao=='asc'?'desc':'asc'})}">ID <i th:if="${ordenarPor=='id'}" class="bi" th:classappend="${direcao=='asc'}?' bi-arrow-up':' bi-arrow-down'"></i></a></th>
<th><a class="text-decoration-none text-body" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=0,tamanho=${tamanho},ordenarPor='nome',direcao=${ordenarPor=='nome' and direcao=='asc'?'desc':'asc'})}">Nome <i th:if="${ordenarPor=='nome'}" class="bi" th:classappend="${direcao=='asc'}?' bi-arrow-up':' bi-arrow-down'"></i></a></th>
<th><a class="text-decoration-none text-body" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=0,tamanho=${tamanho},ordenarPor='unidadeMedida',direcao=${ordenarPor=='unidadeMedida' and direcao=='asc'?'desc':'asc'})}">Unidade <i th:if="${ordenarPor=='unidadeMedida'}" class="bi" th:classappend="${direcao=='asc'}?' bi-arrow-up':' bi-arrow-down'"></i></a></th>
<th>Estoque mínimo</th>
<th><a class="text-decoration-none text-body" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=0,tamanho=${tamanho},ordenarPor='ativo',direcao=${ordenarPor=='ativo' and direcao=='asc'?'desc':'asc'})}">Status <i th:if="${ordenarPor=='ativo'}" class="bi" th:classappend="${direcao=='asc'}?' bi-arrow-up':' bi-arrow-down'"></i></a></th>
<th><a class="text-decoration-none text-body" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=0,tamanho=${tamanho},ordenarPor='atualizadoEm',direcao=${ordenarPor=='atualizadoEm' and direcao=='asc'?'desc':'asc'})}">Atualizado em <i th:if="${ordenarPor=='atualizadoEm'}" class="bi" th:classappend="${direcao=='asc'}?' bi-arrow-up':' bi-arrow-down'"></i></a></th><th class="text-center">Ações</th></tr></thead><tbody>
<tr th:each="insumo:${insumos}"><td th:text="${insumo.id}"></td><td><div class="fw-semibold" th:text="${insumo.nome}"></div><small class="text-body-secondary" th:if="${insumo.descricao!=null}" th:text="${insumo.descricao}"></small></td><td><span th:text="${insumo.unidadeMedida.descricao}"></span> <small class="text-body-secondary" th:text="${'('+insumo.unidadeMedida.simbolo+')'}"></small></td><td class="text-nowrap" th:text="${@formatacao.formatarDecimalBrasileiro(insumo.estoqueMinimo,insumo.unidadeMedida.name()=='UNIDADE'?0:3)+' '+insumo.unidadeMedida.simbolo}"></td><td><span class="badge rounded-pill" th:classappend="${insumo.ativo}?' text-bg-success':' text-bg-secondary'" th:text="${insumo.ativo}?'Ativo':'Inativo'"></span></td><td class="text-nowrap" th:text="${#temporals.format(insumo.atualizadoEm,'dd/MM/yyyy HH:mm')}"></td><td class="text-center text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/insumos/{id}/editar(id=${insumo.id})}" title="Editar"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="${insumo.ativo}?@{/insumos/{id}/inativar(id=${insumo.id})}:@{/insumos/{id}/ativar(id=${insumo.id})}"><button type="submit" class="btn btn-sm" th:classappend="${insumo.ativo}?' btn-outline-warning':' btn-outline-success'" th:title="${insumo.ativo}?'Inativar':'Ativar'"><i class="bi" th:classappend="${insumo.ativo}?' bi-pause-circle':' bi-play-circle'"></i></button></form> <button type="button" class="btn btn-sm btn-outline-danger" title="Excluir" data-bs-toggle="modal" data-bs-target="#modalExclusao" th:data-exclusao-id="${insumo.id}" th:data-exclusao-descricao="${'Insumo '+insumo.nome+' — esta exclusão remove o cadastro permanentemente.'}" th:data-exclusao-url="@{/insumos/{id}/excluir(id=${insumo.id})}"><i class="bi bi-trash"></i></button></td></tr>
<tr th:if="${paginaInsumos.empty}"><td colspan="7" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i><span th:text="${temFiltros}?'Nenhum insumo encontrado para os filtros informados.':'Nenhum insumo cadastrado.'"></span></td></tr></tbody></table></div></div>
<div class="card-footer bg-white" th:if="${paginaInsumos.totalPages>0}"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"><form method="get" th:action="@{/insumos}" class="d-flex align-items-center gap-2"><label class="small text-nowrap" for="tamanho">Por página:</label><select class="form-select form-select-sm" id="tamanho" name="tamanho" onchange="this.form.submit()"><option value="10" th:selected="${tamanho==10}">10</option><option value="20" th:selected="${tamanho==20}">20</option><option value="50" th:selected="${tamanho==50}">50</option></select><input type="hidden" name="filtro" th:value="${filtro}"><input type="hidden" name="ativo" th:value="${ativo}"><input type="hidden" name="ordenarPor" th:value="${ordenarPor}"><input type="hidden" name="direcao" th:value="${direcao}"></form><nav th:if="${paginaInsumos.totalPages>1}"><ul class="pagination pagination-sm mb-0"><li class="page-item" th:classappend="${paginaInsumos.first}?' disabled'"><a class="page-link" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=${paginaInsumos.number-1},tamanho=${tamanho},ordenarPor=${ordenarPor},direcao=${direcao})}">Anterior</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Página '+(paginaInsumos.number+1)+' de '+paginaInsumos.totalPages}"></span></li><li class="page-item" th:classappend="${paginaInsumos.last}?' disabled'"><a class="page-link" th:href="@{/insumos(filtro=${filtro},ativo=${ativo},pagina=${paginaInsumos.number+1},tamanho=${tamanho},ordenarPor=${ordenarPor},direcao=${direcao})}">Próxima</a></li></ul></nav></div></div></div>
<div th:replace="~{fragments/modal-exclusao :: modalExclusao}"></div>
</section></html>
