<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="mb-4"><h1 class="h3" th:text="${titulo}"></h1><p class="text-body-secondary">Defina quanto de cada preparação e acompanhamento é utilizado no produto vendido.</p></header>
<form th:object="${composicao}" th:action="${modoEdicao}?@{/composicoes-produtos/{id}(id=${composicaoId})}:@{/composicoes-produtos}" method="post" data-form-composicao><div class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div>
<div class="card shadow-sm mb-4"><div class="card-body row g-3"><div class="col-md-8"><label class="form-label">Produto de venda *</label><select class="form-select" th:field="*{produtoComercialId}" th:disabled="${modoEdicao}" required><option value="">Selecione</option><option th:each="p:${produtosComerciais}" th:value="${p.id}" th:text="${p.nome}"></option></select><input th:if="${modoEdicao}" type="hidden" name="produtoComercialId" th:value="${composicao.produtoComercialId}"></div><div class="col-md-4"><div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" th:field="*{ativa}"><label class="form-check-label">Composição ativa</label></div></div><div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" th:field="*{observacao}" maxlength="500"></textarea></div></div></div>
<div class="card shadow-sm"><div class="card-header d-flex justify-content-between"><h2 class="h5 mb-0">Componentes</h2><button type="button" class="btn btn-sm btn-outline-primary" data-composicao-adicionar>Adicionar componente</button></div><div class="card-body" data-composicao-itens><div class="border rounded p-3 mb-3" th:each="item,st:*{itens}" data-composicao-item><input type="hidden" th:field="*{itens[__${st.index}__].id}"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" th:field="*{itens[__${st.index}__].tipoComponente}" data-composicao-tipo required><option value="">Selecione</option><option th:each="t:${tiposComponente}" th:value="${t}" th:text="${t.descricao}"></option></select></div><div class="col-md-4"><label class="form-label">Componente</label><select class="form-select" th:field="*{itens[__${st.index}__].referenciaId}" th:data-valor-atual="*{itens[__${st.index}__].referenciaId}" data-composicao-referencia required><option value="">Selecione o tipo</option></select></div><div class="col-md-2"><label class="form-label">Quantidade</label><input class="form-control" type="number" min="0.001" step="0.001" th:field="*{itens[__${st.index}__].quantidade}" data-composicao-quantidade required></div><div class="col-md-1"><label class="form-label">Unidade</label><div class="form-control bg-body-tertiary" data-composicao-unidade>—</div></div><div class="col-md-1"><label class="form-label">Custo</label><div class="form-control bg-body-tertiary text-nowrap" data-composicao-custo>R$ 0,00</div></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger" data-composicao-remover><i class="bi bi-trash"></i></button></div></div></div></div><div class="card-footer d-flex justify-content-between align-items-center"><div><strong>Custo estimado: <span data-composicao-total>R$ 0,00</span></strong><div class="small text-body-secondary">Esta estimativa utiliza os custos médios atuais e não representa lucro líquido.</div></div><div><a class="btn btn-outline-secondary" th:href="@{/composicoes-produtos}">Cancelar</a> <button class="btn btn-primary">Salvar</button></div></div></div></form>
<template data-composicao-template><div class="border rounded p-3 mb-3" data-composicao-item><input type="hidden" data-campo="id"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" data-campo="tipoComponente" data-composicao-tipo required><option value="">Selecione</option><option value="INSUMO">Insumo</option><option value="PREPARACAO_PRODUZIDA">Preparação produzida</option></select></div><div class="col-md-4"><label class="form-label">Componente</label><select class="form-select" data-campo="referenciaId" data-composicao-referencia required><option value="">Selecione o tipo</option></select></div><div class="col-md-2"><label class="form-label">Quantidade</label><input class="form-control" type="number" min="0.001" step="0.001" data-campo="quantidade" data-composicao-quantidade required></div><div class="col-md-1"><label class="form-label">Unidade</label><div class="form-control bg-body-tertiary" data-composicao-unidade>—</div></div><div class="col-md-1"><label class="form-label">Custo</label><div class="form-control bg-body-tertiary text-nowrap" data-composicao-custo>R$ 0,00</div></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger" data-composicao-remover><i class="bi bi-trash"></i></button></div></div></div></template>
</section></html>
