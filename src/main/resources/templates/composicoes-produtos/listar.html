<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="page-header"><div class="page-header-content"><h1 class="h3 fw-semibold mb-1">Composições dos Produtos</h1><p class="text-body-secondary mb-0">Defina quanto de cada preparação e acompanhamento é utilizado em cada produto vendido.</p></div><div class="page-header-actions"><a class="btn btn-primary" th:href="@{/composicoes-produtos/nova}">Nova composição</a></div></header>
<form class="card card-body shadow-sm mb-4 row g-3 flex-row" method="get"><div class="col-md-6"><label class="form-label">Produto</label><input class="form-control" name="produto" th:value="${produto}"></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="ativa"><option value="">Todas</option><option value="true" th:selected="${ativa==true}">Ativas</option><option value="false" th:selected="${ativa==false}">Inativas</option></select></div><div class="col-md-3 align-self-end"><button class="btn btn-primary">Pesquisar</button></div></form>
<div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Produto de venda</th><th>Componentes</th><th>Custo estimado</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="c:${composicoes}"><td class="fw-semibold" th:text="${c.produtoComercialNome}"></td><td th:text="${c.itens.size()}"></td><td th:text="${@formatacao.formatarMoeda(c.custoEstimadoTotal)}"></td><td><span class="badge" th:classappend="${c.ativa}?' text-bg-success':' text-bg-secondary'" th:text="${c.ativa}?'Ativa':'Inativa'"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/composicoes-produtos/{id}(id=${c.id})}"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/composicoes-produtos/{id}/editar(id=${c.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="${c.ativa}?@{/composicoes-produtos/{id}/inativar(id=${c.id})}:@{/composicoes-produtos/{id}/ativar(id=${c.id})}"><button class="btn btn-sm btn-outline-warning" th:text="${c.ativa}?'Inativar':'Ativar'"></button></form></td></tr><tr th:if="${paginaComposicoes.empty}"><td colspan="5" class="text-center text-body-secondary py-5">Nenhuma composição encontrada.</td></tr></tbody></table></div></div>
</section></html>
