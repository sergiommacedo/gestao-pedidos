<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="d-flex justify-content-between mb-4"><div><h1 class="h3" th:text="${composicao.produtoComercialNome}"></h1><p class="text-body-secondary">Composição do produto vendido</p></div><a class="btn btn-outline-secondary" th:href="@{/composicoes-produtos}">Voltar</a></header><div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Tipo</th><th>Componente</th><th>Quantidade</th><th>Custo médio</th><th>Custo estimado</th></tr></thead><tbody><tr th:each="i:${composicao.itens}"><td th:text="${i.tipoComponente.descricao}"></td><td th:text="${i.nome}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(i.quantidade,i.unidade.name()=='UNIDADE'?0:3)+' '+i.unidade.simbolo}"></td><td th:text="${@formatacao.formatarMoeda(i.custoMedio)}"></td><td th:text="${@formatacao.formatarMoeda(i.custoEstimado)}"></td></tr></tbody><tfoot><tr><th colspan="4" class="text-end">Custo estimado comercial</th><th th:text="${@formatacao.formatarMoeda(composicao.custoEstimadoTotal)}"></th></tr></tfoot></table></div><div class="card-footer"><small>Esta estimativa utiliza os custos médios atuais e não representa lucro líquido.</small></div></div></section></html>
