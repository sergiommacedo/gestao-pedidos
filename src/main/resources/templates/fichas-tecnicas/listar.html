<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1"><i class="bi bi-journal-text me-1"></i> Fichas Técnicas</h1><p class="text-body-secondary mb-0">Defina os insumos e as quantidades utilizadas em cada produto produzido.</p></div><a th:href="@{/fichas-tecnicas/nova}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nova ficha técnica</a></header>
<div class="card shadow-sm mb-4"><div class="card-header bg-white"><h2 class="h5 mb-0">Filtros</h2></div><div class="card-body"><form class="row g-3 align-items-end" method="get"><div class="col-md-5"><label class="form-label">Produto</label><input class="form-control" name="produto" th:value="${produto}" placeholder="Nome do produto"></div><div class="col-sm-6 col-md-2"><label class="form-label">Status</label><select class="form-select" name="ativa"><option value="">Todas</option><option value="true" th:selected="${ativa==true}">Ativas</option><option value="false" th:selected="${ativa==false}">Inativas</option></select></div><div class="col-sm-6 col-md-3"><label class="form-label">Situação do custo</label><select class="form-select" name="situacaoCusto"><option value="">Todos</option><option value="COMPLETO" th:selected="${situacaoCusto=='COMPLETO'}">Custo completo</option><option value="PENDENTE" th:selected="${situacaoCusto=='PENDENTE'}">Custo pendente</option></select></div><input type="hidden" name="tamanho" th:value="${tamanho}"><div class="col-auto"><button class="btn btn-primary">Pesquisar</button></div><div class="col-auto" th:if="${temFiltros}"><a class="btn btn-outline-secondary" th:href="@{/fichas-tecnicas}">Limpar</a></div></form></div></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Produto</th><th>Base da ficha</th><th>Insumos</th><th>Custo estimado</th><th>Situação do custo</th><th>Status</th><th>Atualizado em</th><th class="text-center">Ações</th></tr></thead><tbody><tr th:each="f:${fichas}"><td class="fw-semibold" th:text="${f.produtoNome}"></td><td th:text="${f.unidadeVendaProduto.name()=='UNIDADE'?'1 un':'1 kg'}"></td><td th:text="${f.itens.size()}"></td><td th:text="${@formatacao.formatarMoeda(f.custoEstimadoTotal)}"></td><td><span class="badge" th:classappend="${f.custoCompleto}?' text-bg-success':' text-bg-warning'" th:text="${f.custoCompleto}?'Completo':'Pendente'"></span></td><td><span class="badge" th:classappend="${f.ativa}?' text-bg-success':' text-bg-secondary'" th:text="${f.ativa}?'Ativa':'Inativa'"></span></td><td class="text-nowrap" th:text="${#temporals.format(f.atualizadoEm,'dd/MM/yyyy HH:mm')}"></td><td class="text-center text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/fichas-tecnicas/{id}(id=${f.id})}" title="Visualizar"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/fichas-tecnicas/{id}/editar(id=${f.id})}" title="Editar"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="${f.ativa}?@{/fichas-tecnicas/{id}/inativar(id=${f.id})}:@{/fichas-tecnicas/{id}/ativar(id=${f.id})}"><button class="btn btn-sm" th:classappend="${f.ativa}?' btn-outline-warning':' btn-outline-success'" th:title="${f.ativa}?'Inativar':'Ativar'"><i class="bi" th:classappend="${f.ativa}?' bi-pause-circle':' bi-play-circle'"></i></button></form> <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalExclusao" th:data-exclusao-descricao="${'Ficha técnica de '+f.produtoNome}" th:data-exclusao-url="@{/fichas-tecnicas/{id}/excluir(id=${f.id})}" title="Excluir"><i class="bi bi-trash"></i></button></td></tr><tr th:if="${paginaFichas.empty}"><td colspan="8" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Nenhuma ficha técnica encontrada.</td></tr></tbody></table></div><div class="card-footer bg-white d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3" th:if="${paginaFichas.totalPages>0}"><form class="d-flex align-items-center gap-2"><label class="small">Por página:</label><select class="form-select form-select-sm" name="tamanho" onchange="this.form.submit()"><option value="10" th:selected="${tamanho==10}">10</option><option value="20" th:selected="${tamanho==20}">20</option><option value="50" th:selected="${tamanho==50}">50</option></select><input type="hidden" name="produto" th:value="${produto}"><input type="hidden" name="ativa" th:value="${ativa}"><input type="hidden" name="situacaoCusto" th:value="${situacaoCusto}"></form><nav th:if="${paginaFichas.totalPages>1}"><ul class="pagination pagination-sm mb-0"><li class="page-item" th:classappend="${paginaFichas.first}?' disabled'"><a class="page-link" th:href="@{/fichas-tecnicas(produto=${produto},ativa=${ativa},situacaoCusto=${situacaoCusto},pagina=${paginaFichas.number-1},tamanho=${tamanho})}">Anterior</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Página '+(paginaFichas.number+1)+' de '+paginaFichas.totalPages}"></span></li><li class="page-item" th:classappend="${paginaFichas.last}?' disabled'"><a class="page-link" th:href="@{/fichas-tecnicas(produto=${produto},ativa=${ativa},situacaoCusto=${situacaoCusto},pagina=${paginaFichas.number+1},tamanho=${tamanho})}">Próxima</a></li></ul></nav></div></div><div th:replace="~{fragments/modal-exclusao :: modalExclusao}"></div>
</section></html>
