<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="page-header"><div class="page-header-content"><h1 class="h3 fw-semibold mb-1"><i class="bi bi-journal-text me-1"></i> Fichas Técnicas</h1><p class="text-body-secondary mb-0">Defina a receita completa e seu rendimento esperado.</p></div><div class="page-header-actions"><a th:href="@{/fichas-tecnicas/nova}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i> Nova ficha técnica</a></div></header>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th scope="col">Preparação</th><th scope="col">Rendimento esperado</th><th scope="col">Insumos</th><th scope="col">Custo estimado da receita</th><th scope="col">Custo estimado por unidade</th><th scope="col">Situação do custo</th><th scope="col">Status</th><th scope="col">Atualizado em</th><th scope="col" class="text-center">Ações</th></tr></thead><tbody><tr th:each="f:${fichas}"><td class="fw-semibold" th:text="${f.produtoNome}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(f.rendimentoEsperado,f.unidadeRendimento.name()=='UNIDADE'?0:3)+' '+f.unidadeRendimento.simbolo}"></td><td th:text="${f.itens.size()}"></td><td th:text="${@formatacao.formatarMoeda(f.custoEstimadoTotal)}"></td><td th:text="${@formatacao.formatarMoeda(f.custoEstimadoPorUnidade)+'/'+f.unidadeRendimento.simbolo}"></td><td><span class="badge" th:classappend="${f.custoCompleto}?' text-bg-success':' text-bg-warning'" th:text="${f.custoCompleto}?'Completo':'Pendente'"></span></td><td><span class="badge" th:classappend="${f.ativa}?' text-bg-success':' text-bg-secondary'" th:text="${f.ativa}?'Ativa':'Inativa'"></span></td><td class="text-nowrap" th:text="${#temporals.format(f.atualizadoEm,'dd/MM/yyyy HH:mm')}"></td><td class="text-center text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/fichas-tecnicas/{id}(id=${f.id})}" title="Visualizar"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/fichas-tecnicas/{id}/editar(id=${f.id})}" title="Editar"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="${f.ativa}?@{/fichas-tecnicas/{id}/inativar(id=${f.id})}:@{/fichas-tecnicas/{id}/ativar(id=${f.id})}"><button class="btn btn-sm" th:classappend="${f.ativa}?' btn-outline-warning':' btn-outline-success'" th:title="${f.ativa}?'Inativar':'Ativar'"><i class="bi" th:classappend="${f.ativa}?' bi-pause-circle':' bi-play-circle'"></i></button></form> <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalExclusao" th:data-exclusao-descricao="${'Ficha técnica de '+f.produtoNome}" th:data-exclusao-url="@{/fichas-tecnicas/{id}/excluir(id=${f.id})}" title="Excluir"><i class="bi bi-trash"></i></button></td></tr><tr th:if="${paginaFichas.empty}"><td colspan="9" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Nenhuma ficha técnica encontrada.</td></tr></tbody></table></div><div class="card-footer bg-white d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3" th:if="${paginaFichas.totalPages>0}"><form class="d-flex align-items-center gap-2"><label class="small">Por página:</label><select class="form-select form-select-sm" name="tamanho" onchange="this.form.submit()"><option value="10" th:selected="${tamanho==10}">10</option><option value="20" th:selected="${tamanho==20}">20</option><option value="50" th:selected="${tamanho==50}">50</option></select><input type="hidden" name="produto" th:value="${produto}"><input type="hidden" name="ativa" th:value="${ativa}"><input type="hidden" name="situacaoCusto" th:value="${situacaoCusto}"></form><nav th:if="${paginaFichas.totalPages>1}"><ul class="pagination pagination-sm mb-0"><li class="page-item" th:classappend="${paginaFichas.first}?' disabled'"><a class="page-link" th:href="@{/fichas-tecnicas(produto=${produto},ativa=${ativa},situacaoCusto=${situacaoCusto},pagina=${paginaFichas.number-1},tamanho=${tamanho})}">Anterior</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Página '+(paginaFichas.number+1)+' de '+paginaFichas.totalPages}"></span></li><li class="page-item" th:classappend="${paginaFichas.last}?' disabled'"><a class="page-link" th:href="@{/fichas-tecnicas(produto=${produto},ativa=${ativa},situacaoCusto=${situacaoCusto},pagina=${paginaFichas.number+1},tamanho=${tamanho})}">Próxima</a></li></ul></nav></div></div><div th:replace="~{fragments/modal-exclusao :: modalExclusao}"></div>
</section></html>
