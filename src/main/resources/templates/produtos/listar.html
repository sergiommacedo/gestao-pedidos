<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<section layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-0">
                <i class="bi bi-box-seam-fill"></i>
                Produtos
            </h2>

            <small class="text-muted">
                Lista de produtos cadastrados
            </small>
        </div>

        <a th:href="@{/produtos/novo}"
           class="btn btn-primary">

            <i class="bi bi-plus-circle"></i>
            Novo Produto

        </a>

    </div>

    <div class="card shadow-sm">

        <div class="card-header bg-white py-3">

            <form th:action="@{/produtos}"
                  method="get"
                  class="row g-2 align-items-center">

                <div class="col-md-7">

                    <div class="input-group">

                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>

                        <input type="search"
                               name="filtro"
                               class="form-control"
                               placeholder="Pesquisar por nome ou descrição"
                               th:value="${filtro}">

                    </div>

                </div>

                <div class="col-md-auto">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-search"></i>
                        Pesquisar

                    </button>

                </div>

                <div class="col-md-auto"
                     th:if="${filtro != null and !filtro.isBlank()}">

                    <a th:href="@{/produtos}"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-x-circle"></i>
                        Limpar

                    </a>

                </div>

                <input type="hidden"
                       name="pagina"
                       value="0">

                <input type="hidden"
                       name="tamanho"
                       th:value="${tamanho}">

                <input type="hidden"
                       name="ordenarPor"
                       th:value="${ordenarPor}">

                <input type="hidden"
                       name="direcao"
                       th:value="${direcao}">

            </form>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>

                        <th>
                            <a class="text-decoration-none text-dark"
                               th:href="@{/produtos(
                                    filtro=${filtro},
                                    pagina=0,
                                    tamanho=${tamanho},
                                    ordenarPor='id',
                                    direcao=${ordenarPor == 'id' and direcao == 'asc'
                                        ? 'desc'
                                        : 'asc'}
                               )}">

                                ID

                                <i th:if="${ordenarPor == 'id'}"
                                   th:class="${direcao == 'asc'}
                                        ? 'bi bi-arrow-up'
                                        : 'bi bi-arrow-down'">
                                </i>

                            </a>
                        </th>

                        <th>
                            <a class="text-decoration-none text-dark"
                               th:href="@{/produtos(
                                    filtro=${filtro},
                                    pagina=0,
                                    tamanho=${tamanho},
                                    ordenarPor='nome',
                                    direcao=${ordenarPor == 'nome' and direcao == 'asc'
                                        ? 'desc'
                                        : 'asc'}
                               )}">

                                Nome

                                <i th:if="${ordenarPor == 'nome'}"
                                   th:class="${direcao == 'asc'}
                                        ? 'bi bi-arrow-up'
                                        : 'bi bi-arrow-down'">
                                </i>

                            </a>
                        </th>

                        <th>
                            <a class="text-decoration-none text-dark"
                               th:href="@{/produtos(
                                    filtro=${filtro},
                                    pagina=0,
                                    tamanho=${tamanho},
                                    ordenarPor='preco',
                                    direcao=${ordenarPor == 'preco' and direcao == 'asc'
                                        ? 'desc'
                                        : 'asc'}
                               )}">

                                Preço

                                <i th:if="${ordenarPor == 'preco'}"
                                   th:class="${direcao == 'asc'}
                                        ? 'bi bi-arrow-up'
                                        : 'bi bi-arrow-down'">
                                </i>

                            </a>
                        </th>

                        <th>
                            <a class="text-decoration-none text-dark"
                               th:href="@{/produtos(
                                    filtro=${filtro},
                                    pagina=0,
                                    tamanho=${tamanho},
                                    ordenarPor='unidadeVenda',
                                    direcao=${ordenarPor == 'unidadeVenda' and direcao == 'asc'
                                        ? 'desc'
                                        : 'asc'}
                               )}">

                                Unidade de venda

                                <i th:if="${ordenarPor == 'unidadeVenda'}"
                                   th:class="${direcao == 'asc'}
                                        ? 'bi bi-arrow-up'
                                        : 'bi bi-arrow-down'">
                                </i>

                            </a>
                        </th>

                        <th>
                            <a class="text-decoration-none text-dark"
                               th:href="@{/produtos(
                                    filtro=${filtro},
                                    pagina=0,
                                    tamanho=${tamanho},
                                    ordenarPor='ativo',
                                    direcao=${ordenarPor == 'ativo' and direcao == 'asc'
                                        ? 'desc'
                                        : 'asc'}
                               )}">

                                Status

                                <i th:if="${ordenarPor == 'ativo'}"
                                   th:class="${direcao == 'asc'}
                                        ? 'bi bi-arrow-up'
                                        : 'bi bi-arrow-down'">
                                </i>

                            </a>
                        </th>

                        <th>
                            Descrição
                        </th>

                        <th class="text-center">
                            Acompanhamento
                        </th>

                        <th class="text-center">
                            Ações
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="produto : ${produtos}">

                        <td th:text="${produto.id}"></td>

                        <td th:text="${produto.nome}"></td>

                        <td th:text="${#numbers.formatCurrency(produto.preco)}"></td>

                        <td th:text="${produto.unidadeVenda.descricao}"></td>

                        <td>

                            <span class="badge rounded-pill"
                                  th:classappend="${produto.ativo}
                                      ? ' text-bg-success'
                                      : ' text-bg-secondary'">

                                <i th:class="${produto.ativo}
                                    ? 'bi bi-check-circle'
                                    : 'bi bi-x-circle'">
                                </i>

                                <span th:text="${produto.ativo}
                                    ? 'Ativo'
                                    : 'Inativo'">
                                </span>

                            </span>

                        </td>

                        <td>

                            <span th:if="${produto.descricao != null
                                            and !produto.descricao.isBlank()}"
                                  th:text="${produto.descricao}">
                            </span>

                            <span class="text-muted"
                                  th:unless="${produto.descricao != null
                                                and !produto.descricao.isBlank()}">
                                —
                            </span>

                        </td>

                        <td class="text-center">

                            <i th:class="${produto.permiteAcompanhamento}
                                ? 'bi bi-check-circle-fill text-success'
                                : 'bi bi-dash-circle text-muted'"
                               th:title="${produto.permiteAcompanhamento}
                                    ? 'Permite'
                                    : 'Não permite'">
                            </i>

                        </td>

                        <td class="text-center text-nowrap">

                            <a th:href="@{/produtos/{id}/editar(id=${produto.id})}"
                               class="btn btn-sm btn-outline-primary"
                               title="Editar produto">

                                <i class="bi bi-pencil"></i>

                            </a>

                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Excluir produto"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalExclusao"
                                    th:data-exclusao-id="${produto.id}"
                                    th:data-exclusao-descricao="${produto.nome}"
                                    th:data-exclusao-url="@{/produtos/{id}/excluir(id=${produto.id})}">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                    <tr th:if="${paginaProdutos.empty}">

                        <td colspan="8"
                            class="text-center text-muted py-5">

                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>

                            <span th:if="${filtro == null or filtro.isBlank()}">
                                Nenhum produto cadastrado.
                            </span>

                            <span th:unless="${filtro == null or filtro.isBlank()}">

                                Nenhum produto encontrado para

                                <strong th:text="'“' + ${filtro} + '”'">
                                </strong>

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card-footer bg-white"
             th:if="${paginaProdutos.totalPages > 0}">

            <div class="row align-items-center g-3">

                <div class="col-md">

                    <small class="text-muted">

                        Exibindo

                        <span th:text="${paginaProdutos.numberOfElements}">
                        </span>

                        de

                        <span th:text="${paginaProdutos.totalElements}">
                        </span>

                        produtos

                    </small>

                </div>

                <div class="col-md-auto">

                    <form th:action="@{/produtos}"
                          method="get"
                          class="d-flex align-items-center gap-2">

                        <label for="tamanhoPagina"
                               class="small text-muted text-nowrap">

                            Itens por página:

                        </label>

                        <select id="tamanhoPagina"
                                name="tamanho"
                                class="form-select form-select-sm"
                                onchange="this.form.submit()">

                            <option value="10"
                                    th:selected="${tamanho == 10}">
                                10
                            </option>

                            <option value="20"
                                    th:selected="${tamanho == 20}">
                                20
                            </option>

                            <option value="50"
                                    th:selected="${tamanho == 50}">
                                50
                            </option>

                        </select>

                        <input type="hidden"
                               name="filtro"
                               th:value="${filtro}">

                        <input type="hidden"
                               name="pagina"
                               value="0">

                        <input type="hidden"
                               name="ordenarPor"
                               th:value="${ordenarPor}">

                        <input type="hidden"
                               name="direcao"
                               th:value="${direcao}">

                    </form>

                </div>

                <div class="col-md-auto">

                    <nav aria-label="Paginação de produtos">

                        <ul class="pagination pagination-sm mb-0">

                            <li class="page-item"
                                th:classappend="${paginaProdutos.first}
                                    ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/produtos(
                                        filtro=${filtro},
                                        pagina=${paginaProdutos.number - 1},
                                        tamanho=${tamanho},
                                        ordenarPor=${ordenarPor},
                                        direcao=${direcao}
                                   )}">

                                    Anterior

                                </a>

                            </li>

                            <li class="page-item"
                                th:each="numeroPagina :
                                    ${#numbers.sequence(
                                        0,
                                        paginaProdutos.totalPages - 1
                                    )}"
                                th:classappend="${numeroPagina
                                    == paginaProdutos.number}
                                    ? 'active'">

                                <a class="page-link"
                                   th:href="@{/produtos(
                                        filtro=${filtro},
                                        pagina=${numeroPagina},
                                        tamanho=${tamanho},
                                        ordenarPor=${ordenarPor},
                                        direcao=${direcao}
                                   )}"
                                   th:text="${numeroPagina + 1}">
                                </a>

                            </li>

                            <li class="page-item"
                                th:classappend="${paginaProdutos.last}
                                    ? 'disabled'">

                                <a class="page-link"
                                   th:href="@{/produtos(
                                        filtro=${filtro},
                                        pagina=${paginaProdutos.number + 1},
                                        tamanho=${tamanho},
                                        ordenarPor=${ordenarPor},
                                        direcao=${direcao}
                                   )}">

                                    Próxima

                                </a>

                            </li>

                        </ul>

                    </nav>

                </div>

            </div>

        </div>

    </div>

</section>

</html>
