<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="d-flex flex-column flex-sm-row justify-content-between gap-3 mb-4"><div><span class="badge text-bg-secondary mb-2" th:text="${detalhes.estoque.tipoItem.descricao}"></span><h1 class="h3 fw-semibold mb-1" th:text="${detalhes.estoque.nome}">Item</h1><p class="text-body-secondary mb-0">Posição atual e últimas movimentações.</p></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-success" th:href="@{/estoque/entrada(tipo=${detalhes.estoque.tipoItem},id=${detalhes.estoque.referenciaId})}">Registrar entrada</a><a class="btn btn-outline-danger" th:href="@{/estoque/saida(tipo=${detalhes.estoque.tipoItem},id=${detalhes.estoque.referenciaId})}">Registrar saída</a><a class="btn btn-outline-secondary" th:href="@{/estoque}">Voltar</a></div></header><div class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-body-secondary">Estoque atual</small><div class="fs-4 fw-semibold" th:text="${@formatacao.formatarDecimalBrasileiro(detalhes.estoque.estoqueAtual,detalhes.estoque.unidade.name()=='UNIDADE'?0:3)+' '+detalhes.estoque.unidade.simbolo}"></div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-body-secondary">Situação</small><div class="fs-5 fw-semibold" th:text="${detalhes.estoque.situacao}"></div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-body-secondary">Custo médio</small><div class="fs-4 fw-semibold" th:text="${@formatacao.formatarMoeda(detalhes.estoque.custoMedioAtual)}"></div></div></div></div><div class="col-sm-6 col-xl-3"><div class="card shadow-sm h-100"><div class="card-body"><small class="text-body-secondary">Valor estimado</small><div class="fs-4 fw-semibold" th:text="${@formatacao.formatarMoeda(detalhes.estoque.valorEstimadoEstoque)}"></div></div></div></div></div><div class="card shadow-sm"><div class="card-header bg-white"><h2 class="h5 mb-0">Últimas movimentações</h2></div><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Data</th><th>Tipo</th><th>Quantidade</th><th>Valor</th><th>Origem</th></tr></thead><tbody><tr th:each="m:${detalhes.movimentacoes}"><td th:text="${#temporals.format(m.dataMovimentacao,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.tipo.descricao}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(m.quantidade,m.unidadeHistorica.name()=='UNIDADE'?0:3)+' '+m.unidadeHistorica.simbolo}"></td><td th:text="${@formatacao.formatarMoeda(m.valorTotal)}"></td><td th:text="${m.origem}"></td></tr><tr th:if="${#lists.isEmpty(detalhes.movimentacoes)}"><td colspan="5" class="text-center text-body-secondary py-4">Nenhuma movimentação.</td></tr></tbody></table></div></div></section></html>
