<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="mb-4"><h1 class="h3 fw-semibold">Saída manual</h1><p class="text-body-secondary">Registre consumo, perda ou ajuste. O sistema não permite saldo negativo.</p></header><div class="card shadow-sm"><form method="post" th:action="@{/estoque/saida}" th:object="${saida}"><div class="card-body"><div class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Insumo *</label><select class="form-select" th:field="*{insumoId}" required><option value="">Selecione</option><option th:each="i:${insumos}" th:value="${i.id}" th:text="${i.nome+' ('+i.unidadeMedida.simbolo+')'}"></option></select></div><div class="col-md-3"><label class="form-label">Quantidade *</label><input class="form-control" type="number" min="0.001" step="0.001" th:field="*{quantidade}" required></div><div class="col-md-3"><label class="form-label">Tipo *</label><select class="form-select" th:field="*{tipo}"><option th:each="t:${tiposSaida}" th:value="${t}" th:text="${t.descricao}"></option></select></div><div class="col-md-5"><label class="form-label">Data e hora *</label><input class="form-control" type="datetime-local" th:field="*{dataMovimentacao}" required></div><div class="col-12"><label class="form-label">Observação</label><textarea class="form-control" rows="3" maxlength="500" th:field="*{observacao}"></textarea></div></div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/estoque}">Cancelar</a><button class="btn btn-danger">Registrar saída</button></div></form></div></section></html>
