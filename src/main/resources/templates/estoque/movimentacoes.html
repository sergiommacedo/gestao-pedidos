<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="d-flex justify-content-between gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1">Movimentações de Estoque</h1><p class="text-body-secondary mb-0">Histórico imutável de Insumos e Produtos de revenda.</p></div><a class="btn btn-outline-secondary align-self-start" th:href="@{/estoque}">Voltar</a></header><div class="card shadow-sm mb-4"><div class="card-body"><form class="row g-3 align-items-end"><div class="col-md-2"><label class="form-label">Data inicial</label><input class="form-control" type="date" name="dataInicial" th:value="${dataInicial}"></div><div class="col-md-2"><label class="form-label">Data final</label><input class="form-control" type="date" name="dataFinal" th:value="${dataFinal}"></div><div class="col-md-2"><label class="form-label">Categoria</label><select class="form-select" name="categoria"><option value="">Todas</option><option th:each="c:${categorias}" th:value="${c}" th:text="${c.descricao}" th:selected="${c==categoria}"></option></select></div><div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" name="tipo"><option value="">Todos</option><option th:each="t:${tipos}" th:value="${t}" th:text="${t.descricao}" th:selected="${t==tipo}"></option></select></div><div class="col-auto"><button class="btn btn-primary">Filtrar</button></div></form></div></div><div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Data</th><th>Categoria</th><th>Item</th><th>Tipo</th><th>Entrada</th><th>Saída</th><th>Unidade</th><th>Custo</th><th>Valor</th><th>Origem</th><th>Observação</th></tr></thead><tbody><tr th:each="m:${movimentacoes}"><td class="text-nowrap" th:text="${#temporals.format(m.dataMovimentacao,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.tipoItem.descricao}"></td><td th:text="${m.nomeHistorico}"></td><td th:text="${m.tipo.descricao}"></td><td class="text-success" th:text="${m.tipo.entrada?@formatacao.formatarDecimalBrasileiro(m.quantidade,m.unidadeHistorica.name()=='UNIDADE'?0:3):'—'}"></td><td class="text-danger" th:text="${!m.tipo.entrada?@formatacao.formatarDecimalBrasileiro(m.quantidade,m.unidadeHistorica.name()=='UNIDADE'?0:3):'—'}"></td><td th:text="${m.unidadeHistorica.simbolo}"></td><td th:text="${@formatacao.formatarMoeda(m.custoUnitario)}"></td><td th:text="${@formatacao.formatarMoeda(m.valorTotal)}"></td><td th:text="${m.origem}"></td><td th:text="${m.observacao?:'—'}"></td></tr><tr th:if="${paginaMovimentacoes.empty}"><td colspan="11" class="text-center text-body-secondary py-5">Nenhuma movimentação encontrada.</td></tr></tbody></table></div><div class="card-footer bg-white d-flex justify-content-between" th:if="${paginaMovimentacoes.totalPages>1}"><a class="btn btn-sm btn-outline-secondary" th:classappend="${paginaMovimentacoes.first}?' disabled'" th:href="@{/estoque/movimentacoes(dataInicial=${dataInicial},dataFinal=${dataFinal},categoria=${categoria},referenciaId=${referenciaId},tipo=${tipo},compraId=${compraId},pagina=${paginaMovimentacoes.number-1},tamanho=${tamanho})}">Anterior</a><span th:text="${'Página '+(paginaMovimentacoes.number+1)+' de '+paginaMovimentacoes.totalPages}"></span><a class="btn btn-sm btn-outline-secondary" th:classappend="${paginaMovimentacoes.last}?' disabled'" th:href="@{/estoque/movimentacoes(dataInicial=${dataInicial},dataFinal=${dataFinal},categoria=${categoria},referenciaId=${referenciaId},tipo=${tipo},compraId=${compraId},pagina=${paginaMovimentacoes.number+1},tamanho=${tamanho})}">Próxima</a></div></div></section></html>
