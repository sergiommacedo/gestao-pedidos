<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<section layout:fragment="content">
    <header class="page-header kanban-topo mb-2">
        <div class="page-header-content">
            <h2 class="mb-0"><i class="bi bi-kanban"></i> Kanban de Pedidos</h2>
            <small class="text-muted">Acompanhe e avance os pedidos do dia</small>
        </div>

        <div class="page-header-actions kanban-navegacao">
            <div class="btn-group" role="group" aria-label="Visualização dos pedidos">
                <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
                    <i class="bi bi-list-ul"></i> Lista
                </a>
                <a th:href="@{/pedidos/kanban(dataAgendada=${dataAgendadaIso}, mostrarCancelados=${mostrarCancelados})}"
                   class="btn btn-outline-secondary active" aria-current="page">
                    <i class="bi bi-kanban"></i> Kanban
                </a>
            </div>
            <a th:href="@{/pedidos/novo}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Novo Pedido
            </a>
            <a th:href="@{/pedidos/planejamento(dataAgendada=${dataAgendadaIso})}" class="btn btn-outline-primary">
                <i class="bi bi-sign-turn-right"></i> Planejar entregas
            </a>
        </div>
    </header>

    <div class="card shadow-sm mb-2 kanban-filtros">
        <div class="card-body kanban-filtros-corpo">
            <form th:action="@{/pedidos/kanban}" method="get"
                  class="row g-2 align-items-end">
                <div class="col-sm-6 col-lg-3">
                    <label for="dataKanbanVisual" class="form-label">Data dos pedidos</label>
                    <input type="text" id="dataKanbanVisual" class="form-control kanban-data"
                           inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa"
                           th:value="${#temporals.format(dataAgendada, 'dd/MM/yyyy')}"
                           data-data-brasileira>
                    <input type="hidden" name="dataAgendada" th:value="${dataAgendadaIso}" data-data-iso>
                </div>
                <div class="col-sm-6 col-lg-auto">
                    <div class="form-check form-switch pb-2">
                        <input type="checkbox" id="mostrarCancelados" name="mostrarCancelados"
                               value="true" class="form-check-input"
                               th:checked="${mostrarCancelados}">
                        <label for="mostrarCancelados" class="form-check-label">
                            Visualizar cancelados
                        </label>
                    </div>
                </div>
                <div class="col-lg-auto">
                    <button type="submit" class="btn btn-primary kanban-filtro-btn">
                        <i class="bi bi-calendar-check"></i> Aplicar
                    </button>
                </div>
                <div class="col-lg-auto">
                    <a th:href="@{/pedidos/kanban}" class="btn btn-outline-secondary kanban-filtro-btn">
                        Hoje
                    </a>
                </div>
            </form>
        </div>
    </div>

    <section class="kanban-area" aria-label="Kanban do dia">
        <div class="kanban-area-cabecalho">
            <h3 class="h6 fw-bold mb-0">Kanban do dia</h3>
            <div class="btn-group btn-group-sm" role="group" aria-label="Navegar pelas colunas do Kanban">
                <button type="button" class="btn btn-outline-secondary" data-kanban-anterior
                        title="Coluna anterior" aria-label="Coluna anterior">←</button>
                <button type="button" class="btn btn-outline-secondary" data-kanban-proximo
                        title="Próxima coluna" aria-label="Próxima coluna">→</button>
            </div>
        </div>
        <div class="kanban-viewport" data-kanban-viewport tabindex="0">
        <div class="kanban-pedidos" aria-label="Fluxo de pedidos">
        <section class="kanban-coluna"
                 th:each="statusColuna : ${statusKanban}">
            <th:block th:with="pedidosColuna=${pedidosPorStatus.get(statusColuna)}">
            <header class="kanban-cabecalho"
                    th:classappend="${statusColuna.name() == 'PENDENTE'} ? ' bg-warning text-dark' :
                        (${statusColuna.name() == 'EM_PREPARACAO'} ? ' bg-info text-dark' :
                        (${statusColuna.name() == 'PRONTO'} ? ' bg-success-subtle text-success-emphasis' :
                        (${statusColuna.name() == 'SAIU_PARA_ENTREGA'} ? ' bg-dark text-white' : ' bg-success text-white')))">
                <div class="d-flex justify-content-between align-items-center gap-2">
                    <h3 class="h6 fw-bold mb-0" th:text="${statusColuna.descricao}">Status</h3>
                    <span class="badge text-bg-light border"
                          th:text="${pedidosColuna != null ? #lists.size(pedidosColuna) : 0}">0</span>
                </div>
            </header>

            <div class="kanban-corpo">
                <th:block th:if="${pedidosColuna != null}">
                <article class="card kanban-cartao border shadow-sm"
                         th:each="pedido : ${pedidosColuna}">
                    <div class="card-body kanban-cartao-corpo">
                        <div class="d-flex justify-content-between align-items-start gap-2 kanban-cartao-cabecalho">
                            <strong class="fs-5" th:text="'#' + ${pedido.id}">#0</strong>
                            <span class="badge"
                                  th:classappend="${pedido.tipoEntrega.name() == 'ENTREGA'}
                                      ? ' text-bg-primary' : ' text-bg-secondary'"
                                  th:text="${pedido.tipoEntrega.name() == 'ENTREGA'} ? 'Entrega' : 'Retirada'">
                            </span>
                        </div>

                        <div class="small mb-2">
                            <div class="fw-semibold" th:if="${pedido.horarioInicio != null}"
                                 th:text="${pedido.horarioFim != null ? #temporals.format(pedido.horarioInicio, 'HH:mm') + '–' + #temporals.format(pedido.horarioFim, 'HH:mm') : #temporals.format(pedido.horarioInicio, 'HH:mm')}"></div>
                            <th:block th:if="${pedido.tipoEntrega.name() == 'ENTREGA'}">
                                <div th:text="${pedido.enderecoEntregaResumido != null and !pedido.enderecoEntregaResumido.isBlank() ? pedido.enderecoEntregaResumido : 'Endereço incompleto'}"></div>
                                <div class="fw-bold text-uppercase" th:if="${pedido.bairroEntrega != null}" th:text="${pedido.bairroEntrega}"></div>
                            </th:block>
                        </div>

                        <div class="fw-bold quebra-linha kanban-cliente" th:text="${pedido.clienteNome}"></div>
                        <div class="d-flex flex-wrap align-items-center column-gap-2 text-muted kanban-metadados">
                            <span class="text-nowrap">
                                <i class="bi bi-telephone me-1"></i>
                                <span th:text="${@formatacao.formatarTelefone(pedido.clienteTelefone)}"></span>
                            </span>
                            <span class="text-nowrap" th:if="${pedido.criadoEm != null}">
                                <i class="bi bi-clock me-1"></i>
                                <span th:text="${#temporals.format(pedido.criadoEm, 'HH:mm')}"></span>
                            </span>
                        </div>

                        <div class="kanban-itens mb-2">
                            <div class="d-flex justify-content-between gap-2 small"
                                 th:each="item, itemStat : ${pedido.itens}"
                                 th:if="${itemStat.index < 3}">
                                <span class="text-truncate" th:text="${item.produtoNome}"></span>
                                <strong class="text-nowrap"
                                        th:text="${@formatacao.formatarQuantidade(item.quantidade, item.unidadeVenda)}"></strong>
                            </div>
                            <small class="text-muted" th:if="${pedido.itens != null and pedido.itens.size() > 3}"
                                   th:text="'+' + ${pedido.itens.size() - 3} + ' item(ns)'"></small>
                        </div>

                        <div class="mb-2">
                            <span class="badge" th:classappend="${situacoesEstoque[pedido.id] == 'Estoque baixado'} ? ' text-bg-success' : (${situacoesEstoque[pedido.id] == 'Estoque estornado'} ? ' text-bg-info' : ' text-bg-secondary')" th:text="${situacoesEstoque[pedido.id]}"></span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-top kanban-total">
                            <span class="text-muted">Total</span>
                            <strong class="fs-5" th:text="${@formatacao.formatarMoeda(pedido.valorTotal)}"></strong>
                        </div>

                        <form th:if="${proximosStatus[pedido.id] != pedido.status}"
                              th:action="@{/pedidos/{id}/status(id=${pedido.id})}"
                              method="post" class="d-grid kanban-acao-principal">
                            <input type="hidden" name="novoStatus" th:value="${proximosStatus[pedido.id]}">
                            <input type="hidden" name="dataAgendada" th:value="${dataAgendadaIso}">
                            <input type="hidden" name="visualizacao" value="kanban">
                            <input type="hidden" name="mostrarCancelados" th:value="${mostrarCancelados}">
                            <button type="submit" class="btn btn-primary kanban-btn-avancar text-nowrap">
                                <span th:text="${pedido.status.name() == 'PRONTO' and pedido.tipoEntrega.name() == 'RETIRADA' ? 'Concluir retirada' : (pedido.status.name() == 'PRONTO' ? 'Saiu para entrega' : (pedido.status.name() == 'SAIU_PARA_ENTREGA' ? 'Marcar como entregue' : 'Avançar para ' + proximosStatus[pedido.id].descricao))}"></span>
                                <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </form>

                        <div class="kanban-acoes-secundarias">
                            <button type="button" class="btn btn-outline-secondary kanban-btn-secundario"
                                    title="Visualizar pedido"
                                    data-bs-toggle="modal" data-bs-target="#modalDetalhesPedido"
                                    th:data-detalhes-url="@{/pedidos/{id}/detalhes(id=${pedido.id}, origem='kanban',
                                        dataAgendada=${dataAgendadaIso}, mostrarCancelados=${mostrarCancelados})}">
                                <i class="bi bi-eye"></i> Visualizar
                            </button>
                            <a th:if="${statusEditaveis.contains(pedido.status)}"
                               th:href="@{/pedidos/{id}/editar(id=${pedido.id}, origem='kanban',
                                    dataAgendada=${dataAgendadaIso}, mostrarCancelados=${mostrarCancelados})}"
                               class="btn btn-outline-secondary kanban-btn-secundario" title="Editar pedido">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:if="${statusImprimiveis.contains(pedido.status)}"
                               th:href="@{/pedidos/{id}/comanda(id=${pedido.id}, origem='kanban',
                                    dataAgendada=${dataAgendadaIso}, mostrarCancelados=${mostrarCancelados})}"
                               class="btn btn-outline-secondary kanban-btn-secundario" target="_blank" rel="noopener"
                               title="Imprimir comanda">
                                <i class="bi bi-printer"></i> Imprimir
                            </a>
                        </div>

                        <form th:if="${transicoesStatus[pedido.id].contains(statusCancelado)}"
                              th:action="@{/pedidos/{id}/status(id=${pedido.id})}"
                              method="post" class="d-grid kanban-cancelamento">
                            <input type="hidden" name="dataAgendada" th:value="${dataAgendadaIso}">
                            <input type="hidden" name="visualizacao" value="kanban">
                            <input type="hidden" name="mostrarCancelados" th:value="${mostrarCancelados}">
                            <button type="button" class="btn btn-outline-danger kanban-btn-secundario"
                                    data-cancelar-pedido th:data-pedido-id="${pedido.id}"
                                    th:data-cliente="${pedido.clienteNome}">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </button>
                        </form>
                    </div>
                </article>
                </th:block>

                <div class="kanban-vazio"
                     th:if="${pedidosColuna == null or #lists.isEmpty(pedidosColuna)}">
                    <i class="bi bi-inbox d-block fs-3 mb-2"></i>
                    Nenhum pedido
                </div>
            </div>
            </th:block>
        </section>
        </div>
        </div>
    </section>

    <section class="mt-4" th:if="${mostrarCancelados}">
        <div class="d-flex align-items-center gap-2 mb-3">
            <h3 class="h5 mb-0 text-danger"><i class="bi bi-x-octagon"></i> Cancelados</h3>
            <span class="badge text-bg-danger" th:text="${pedidosCancelados.size()}">0</span>
        </div>
        <div class="row g-3" th:if="${!pedidosCancelados.isEmpty()}">
            <div class="col-md-6 col-xl-4" th:each="pedido : ${pedidosCancelados}">
                <article class="card border border-danger-subtle shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between gap-2 mb-2">
                            <strong class="fs-5" th:text="'#' + ${pedido.id}"></strong>
                            <span class="badge text-bg-danger">Cancelado</span>
                        </div>
                        <div class="fw-bold" th:text="${pedido.clienteNome}"></div>
                        <div class="text-muted mb-3"
                             th:text="${@formatacao.formatarTelefone(pedido.clienteTelefone)}"></div>
                        <button type="button" class="btn btn-outline-secondary w-100"
                                title="Visualizar pedido"
                                data-bs-toggle="modal" data-bs-target="#modalDetalhesPedido"
                                th:data-detalhes-url="@{/pedidos/{id}/detalhes(id=${pedido.id}, origem='kanban',
                                    dataAgendada=${dataAgendadaIso}, mostrarCancelados=${mostrarCancelados})}">
                            <i class="bi bi-eye"></i> Visualizar
                        </button>
                    </div>
                </article>
            </div>
        </div>
        <div class="alert alert-light border text-muted" th:if="${pedidosCancelados.isEmpty()}">
            Nenhum pedido cancelado nesta data.
        </div>
    </section>
</section>
</html>
