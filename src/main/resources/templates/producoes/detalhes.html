<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="d-flex justify-content-between mb-4"><div><h1 class="h3">Produção</h1><p class="text-body-secondary" th:text="${#temporals.format(resumo.producao.dataProducao,'dd/MM/yyyy')}"></p></div><a class="btn btn-outline-secondary" th:href="@{/producoes}">Voltar</a></header>
<div class="row g-3 mb-4"><div class="col-md-3"><div class="card card-body h-100"><small>Quantidade produzida</small><strong th:text="${@formatacao.formatarDecimalBrasileiro(detalhes.quantidadeTotal,3)+' kg'}"></strong></div></div><div class="col-md-3"><div class="card card-body h-100"><small>Valor dos insumos consumidos</small><strong th:text="${@formatacao.formatarMoeda(resumo.producao.valorInsumosConsumidos)}"></strong></div></div><div class="col-md-3"><div class="card card-body h-100"><small>Gastos adicionais</small><strong th:text="${@formatacao.formatarMoeda(resumo.producao.gastosAdicionais)}"></strong></div></div><div class="col-md-3"><div class="card card-body h-100"><small>Custo total da produção</small><strong th:text="${@formatacao.formatarMoeda(resumo.producao.custoTotal)}"></strong></div></div></div>
<div class="card shadow-sm mb-4"><div class="card-header"><h2 class="h5 mb-0">Preparação produzida</h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Preparação</th><th>Rendimento real</th><th>Custo total</th><th>Custo por kg produzido</th></tr></thead><tbody><tr th:each="i:${detalhes.produtos}"><td th:text="${i.produtoNome}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(i.quantidade,3)+' '+i.unidade.simbolo}"></td><td th:text="${@formatacao.formatarMoeda(i.custoTotal)}"></td><td th:text="${@formatacao.formatarMoeda(i.custoUnitario)+'/'+i.unidade.simbolo}"></td></tr></tbody></table></div></div>
<div class="card shadow-sm mb-4"><div class="card-header"><h2 class="h5 mb-0">Prévia dos Insumos</h2></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Insumo</th><th>Necessário</th><th>Custo médio</th><th>Valor consumido</th></tr></thead><tbody><tr th:each="i:${detalhes.consumos}"><td th:text="${i.insumoNome}"></td><td th:text="${@formatacao.formatarDecimalBrasileiro(i.quantidade,i.unidade.name()=='UNIDADE'?0:3)+' '+i.unidade.simbolo}"></td><td th:text="${@formatacao.formatarMoeda(i.custoMedio)}"></td><td th:text="${@formatacao.formatarMoeda(i.custoTotal)}"></td></tr></tbody></table></div></div><div class="d-flex gap-2" th:if="${resumo.producao.status.name()=='RASCUNHO'}"><a class="btn btn-outline-secondary" th:href="@{/producoes/{id}/editar(id=${resumo.producao.id})}">Editar</a><form method="post" th:action="@{/producoes/{id}/confirmar(id=${resumo.producao.id})}"><button class="btn btn-success">Confirmar Produção</button></form></div></section></html>
