<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1"><i class="bi bi-clipboard-data me-1"></i> Produções</h1><p class="text-body-secondary mb-0">Acompanhe os gastos e o resultado bruto estimado de cada produção.</p></div><a th:href="@{/producoes/nova}" class="btn btn-primary flex-shrink-0"><i class="bi bi-plus-circle me-1"></i> Nova produção</a></header>
<div class="alert alert-danger" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>
<div class="card shadow-sm mb-4"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">Filtros</h2></div><div class="card-body"><form method="get" th:action="@{/producoes}" class="row g-3 align-items-end"><div class="col-sm-6 col-md-3"><label for="dataInicial" class="form-label">Data inicial</label><input id="dataInicial" name="dataInicial" type="date" class="form-control" th:value="${dataInicial}"></div><div class="col-sm-6 col-md-3"><label for="dataFinal" class="form-label">Data final</label><input id="dataFinal" name="dataFinal" type="date" class="form-control" th:value="${dataFinal}"></div><input type="hidden" name="tamanho" th:value="${tamanho}"><div class="col-auto"><button class="btn btn-primary"><i class="bi bi-search me-1"></i> Filtrar</button></div><div class="col-auto" th:if="${dataInicial!=null or dataFinal!=null}"><a th:href="@{/producoes}" class="btn btn-outline-secondary">Limpar</a></div></form></div></div>
<div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Data</th><th>Ingredientes</th><th>Embalagens</th><th>Gás/Energia</th><th>Outros</th><th>Total gasto</th><th>Faturamento</th><th>Resultado bruto</th><th>Margem</th><th>Ações</th></tr></thead><tbody>
<tr th:each="item:${producoes}"><td class="text-nowrap fw-semibold" th:text="${#temporals.format(item.producao.dataProducao,'dd/MM/yyyy')}"></td><td th:text="${@formatacao.formatarMoeda(item.producao.valorIngredientes)}"></td><td th:text="${@formatacao.formatarMoeda(item.producao.valorEmbalagens)}"></td><td th:text="${@formatacao.formatarMoeda(item.producao.valorGasEnergia)}"></td><td th:text="${@formatacao.formatarMoeda(item.producao.valorOutros)}"></td><td class="fw-semibold" th:text="${@formatacao.formatarMoeda(item.totalGasto)}"></td><td th:text="${@formatacao.formatarMoeda(item.faturamentoTotal)}"></td><td><span class="fw-semibold" th:text="${@formatacao.formatarMoeda(item.resultadoBrutoEstimado)}"></span></td><td th:text="${@formatacao.formatarDecimalBrasileiro(item.margemBrutaEstimada,2)+'%'}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/producoes/{id}(id=${item.producao.id})}" title="Visualizar"><i class="bi bi-eye"></i></a> <a class="btn btn-sm btn-outline-primary" th:href="@{/producoes/{id}/editar(id=${item.producao.id})}" title="Editar"><i class="bi bi-pencil"></i></a> <button type="button" class="btn btn-sm btn-outline-danger" title="Excluir" data-bs-toggle="modal" data-bs-target="#modalExclusao" th:data-exclusao-id="${item.producao.id}" th:data-exclusao-descricao="${'Produção de '+#temporals.format(item.producao.dataProducao,'dd/MM/yyyy')+' — somente o cadastro de despesas será removido; os pedidos não serão excluídos nem alterados.'}" th:data-exclusao-url="@{/producoes/{id}/excluir(id=${item.producao.id})}"><i class="bi bi-trash"></i></button></td></tr>
<tr th:if="${paginaProducoes.empty}"><td colspan="10" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Nenhuma produção cadastrada.</td></tr></tbody></table></div></div>
<div class="card-footer bg-white" th:if="${paginaProducoes.totalPages>0}"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3"><form method="get" th:action="@{/producoes}" class="d-flex align-items-center gap-2"><label class="small text-nowrap" for="tamanho">Por página:</label><select class="form-select form-select-sm" id="tamanho" name="tamanho" onchange="this.form.submit()"><option value="10" th:selected="${tamanho==10}">10</option><option value="20" th:selected="${tamanho==20}">20</option><option value="50" th:selected="${tamanho==50}">50</option></select><input type="hidden" name="dataInicial" th:value="${dataInicial}"><input type="hidden" name="dataFinal" th:value="${dataFinal}"></form><nav th:if="${paginaProducoes.totalPages>1}"><ul class="pagination pagination-sm mb-0"><li class="page-item" th:classappend="${paginaProducoes.first}?' disabled'"><a class="page-link" th:href="@{/producoes(dataInicial=${dataInicial},dataFinal=${dataFinal},pagina=${paginaProducoes.number-1},tamanho=${tamanho})}">Anterior</a></li><li class="page-item disabled"><span class="page-link" th:text="${'Página '+(paginaProducoes.number+1)+' de '+paginaProducoes.totalPages}"></span></li><li class="page-item" th:classappend="${paginaProducoes.last}?' disabled'"><a class="page-link" th:href="@{/producoes(dataInicial=${dataInicial},dataFinal=${dataFinal},pagina=${paginaProducoes.number+1},tamanho=${tamanho})}">Próxima</a></li></ul></nav></div></div></div>
<div th:replace="~{fragments/modal-exclusao :: modalExclusao}"></div>
</section></html>
