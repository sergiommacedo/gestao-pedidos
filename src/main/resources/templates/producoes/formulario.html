<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content"><header class="d-flex justify-content-between mb-4"><div><h1 class="h3" th:text="${titulo}"></h1><p class="text-body-secondary">Registre o rendimento real da preparação produzida.</p></div><a class="btn btn-outline-secondary" th:href="@{/producoes}">Voltar</a></header>
<form th:object="${producao}" th:action="${modoEdicao}?@{/producoes/{id}(id=${producaoId})}:@{/producoes}" method="post" data-itens-producao><div class="alert alert-danger" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><div class="card shadow-sm mb-4"><div class="card-header"><h2 class="h5 mb-0">1. Dados da Produção</h2></div><div class="card-body row g-3"><div class="col-md-4"><label class="form-label">Data *</label><input class="form-control" type="date" th:field="*{dataProducao}" required></div><div class="col-md-8"><label class="form-label">Observação</label><textarea class="form-control" th:field="*{observacao}" maxlength="500"></textarea></div></div></div>
<div class="card shadow-sm mb-4"><div class="card-header"><h2 class="h5 mb-0">2. Preparação produzida</h2></div><div class="card-body"><div th:if="${#lists.isEmpty(produtosProduzidos)}" class="alert alert-warning">Nenhuma preparação com Ficha Técnica ativa está disponível. <a th:href="@{/fichas-tecnicas}">Cadastrar ou revisar Ficha Técnica.</a></div><div data-lista-produtos-producao><div class="row g-3 align-items-end" th:each="item,st:*{itens}" data-item-producao><input type="hidden" th:field="*{itens[__${st.index}__].id}"><div class="col-md-7"><label class="form-label">Preparação *</label><select class="form-select" th:field="*{itens[__${st.index}__].produtoId}" data-produto-producao required><option value="">Selecione</option><option th:each="p:${produtosProduzidos}" th:value="${p.id}" th:text="${p.nome}" th:data-unidade="${p.unidadeVenda.name()}"></option></select></div><div class="col-md-3"><label class="form-label">Quantidade real produzida *</label><input class="form-control" type="number" min="0.001" step="0.001" th:field="*{itens[__${st.index}__].quantidade}" required></div><div class="col-md-2"><label class="form-label">Unidade</label><div class="form-control bg-body-tertiary" data-unidade-producao>—</div></div></div></div></div></div>
<div class="card shadow-sm mb-4"><div class="card-header"><h2 class="h5 mb-0">3. Gastos adicionais</h2></div><div class="card-body row g-3"><div class="col-md-6"><label class="form-label">Gás/Energia</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{valorGasEnergia}"></div><div class="col-md-6"><label class="form-label">Outros</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{valorOutros}"></div></div></div><div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" th:href="@{/producoes}">Cancelar</a><button class="btn btn-primary">Salvar rascunho</button></div></form></section></html>
