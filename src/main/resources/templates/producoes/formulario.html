<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"><section layout:fragment="content">
<header class="d-flex justify-content-between align-items-start gap-3 mb-4"><div><h1 class="h3 fw-semibold mb-1" th:text="${titulo}">Nova produção</h1><p class="text-body-secondary mb-0">Registre os gastos gerais desta produção.</p></div><a th:href="@{/producoes}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Voltar</a></header>
<form th:object="${producao}" th:action="${modoEdicao}?@{/producoes/{id}(id=${producaoId})}:@{/producoes}" method="post" data-form-producao novalidate><div class="row g-4"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">Dados da produção</h2></div><div class="card-body"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="erro:${#fields.globalErrors()}" th:text="${erro}"></div><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="dataProducao">Data da produção *</label><input class="form-control" th:classappend="${#fields.hasErrors('dataProducao')}?' is-invalid'" type="date" id="dataProducao" th:field="*{dataProducao}" required><div class="invalid-feedback" th:errors="*{dataProducao}"></div></div><div class="col-md-6"></div>
<div class="col-md-6"><label class="form-label">Ingredientes</label><div class="input-group"><span class="input-group-text">R$</span><input type="text" class="form-control" inputmode="decimal" data-moeda-visual th:value="${@formatacao.formatarDecimalBrasileiro(producao.valorIngredientes,2)}"><input type="hidden" id="valorIngredientes" th:field="*{valorIngredientes}" data-moeda-decimal data-despesa-producao></div><div class="text-danger small" th:errors="*{valorIngredientes}"></div></div>
<div class="col-md-6"><label class="form-label">Embalagens</label><div class="input-group"><span class="input-group-text">R$</span><input type="text" class="form-control" inputmode="decimal" data-moeda-visual th:value="${@formatacao.formatarDecimalBrasileiro(producao.valorEmbalagens,2)}"><input type="hidden" id="valorEmbalagens" th:field="*{valorEmbalagens}" data-moeda-decimal data-despesa-producao></div><div class="text-danger small" th:errors="*{valorEmbalagens}"></div></div>
<div class="col-md-6"><label class="form-label">Gás/Energia</label><div class="input-group"><span class="input-group-text">R$</span><input type="text" class="form-control" inputmode="decimal" data-moeda-visual th:value="${@formatacao.formatarDecimalBrasileiro(producao.valorGasEnergia,2)}"><input type="hidden" id="valorGasEnergia" th:field="*{valorGasEnergia}" data-moeda-decimal data-despesa-producao></div><div class="text-danger small" th:errors="*{valorGasEnergia}"></div></div>
<div class="col-md-6"><label class="form-label">Outros</label><div class="input-group"><span class="input-group-text">R$</span><input type="text" class="form-control" inputmode="decimal" data-moeda-visual th:value="${@formatacao.formatarDecimalBrasileiro(producao.valorOutros,2)}"><input type="hidden" id="valorOutros" th:field="*{valorOutros}" data-moeda-decimal data-despesa-producao></div><div class="text-danger small" th:errors="*{valorOutros}"></div></div>
<div class="col-12"><label class="form-label" for="observacao">Observação</label><textarea class="form-control" id="observacao" rows="4" maxlength="500" th:field="*{observacao}" th:classappend="${#fields.hasErrors('observacao')}?' is-invalid'"></textarea><div class="invalid-feedback" th:errors="*{observacao}"></div></div></div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a th:href="@{/producoes}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-circle me-1"></i><span th:text="${modoEdicao}?'Salvar alterações':'Salvar produção'"></span></button></div></div></div>
<div class="col-lg-4"><div class="card shadow-sm"><div class="card-header bg-white py-3"><h2 class="h5 mb-0">Prévia</h2></div><div class="card-body"><div class="text-body-secondary">Total gasto</div><div class="display-6 fw-semibold" data-total-gasto-producao>R$ 0,00</div><p class="small text-body-secondary mb-0 mt-2">Soma das quatro categorias informadas.</p></div></div></div></div></form>
</section></html>
